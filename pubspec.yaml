name: reptrack
description: "RepTrack - tracker treningów siłowych"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  collection: ^1.19.1
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.2
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_timezone: ^5.1.1
  freezed_annotation: ^3.1.0
  go_router: ^18.1.0
  intl: ^0.20.3
  meta: ^1.19.0
  path_provider: ^2.1.6
  sqlite3: ^3.7.1
  timezone: ^0.11.2
  uuid: ^4.6.0
  wakelock_plus: ^1.8.1

dev_dependencies:
  build_runner: ^2.16.2
  drift_dev: ^2.35.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^4.0.3
  path: ^1.9.1
  yaml: ^3.1.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/fonts/Inter-OFL.txt
    - assets/seed/exercises.json
    - assets/seed/free-exercise-db-LICENSE.txt

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
